name: Segarkan Anime

# Menarik playlist video anime dari YouTube channel Muse Asia setiap
# 4 kali sehari. Data playlist digenerate ke anime.html.
# Lalu jalankan build_anime.py

on:
  schedule:
    # 4 kali sehari: 01:20, 07:20, 13:20, 19:20 UTC
    - cron: "20 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: segarkan-anime
  cancel-in-progress: false

jobs:
  segarkan-anime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip

      - name: Ambil playlist dari YouTube (MuseAsia)
        run: python build_anime.py

      - name: Commit bila ada perubahan
        run: |
          if git diff --quiet -- 'anime.html' '_muse_playlists.json' '_embed_status.json'; then
            echo "Tidak ada video baru."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'anime.html' '_muse_playlists.json' '_embed_status.json'
          git commit -m "chore(anime): playlist terbaru dari MuseAsia ($(date -u '+%Y-%m-%d %H:%M UTC') [skip ci])"
          git push
